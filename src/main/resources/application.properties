# Application Configuration
spring.application.name=forumhub
spring.profiles.active=dev

# Server Configuration
server.port=8080

# ==================== Database ====================
# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/forumhub
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Flyway Configuration
spring.flyway.locations=classpath:db/migration
spring.flyway.enabled=true

# ==================== Logging ====================
logging.level.root=INFO
logging.level.com.alura.forumhub=DEBUG
logging.level.org.springframework.security=DEBUG

# ==================== JWT ====================
# Tempo de expiração do token em horas
jwt.expiration=24
# Chave secreta para assinar o JWT (ALTERAR EM PRODUÇÃO!)
jwt.secret=seu-secret-key-super-seguro-aqui-mudar-em-producao

# ==================== Swagger/OpenAPI ====================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/v3/api-docs
